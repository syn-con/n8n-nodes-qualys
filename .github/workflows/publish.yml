# Publishes this n8n community node package to npm on every version tag push.
#
# n8n requires community nodes submitted for verification to be published via
# GitHub Actions with an npm provenance statement. Provenance lets anyone
# cryptographically verify that a package was built by this exact workflow, from
# this exact repository and commit. n8n's scanner checks provenance first and
# refuses to scan a package published any other way.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open this package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: syn-con
#        Repository name:  n8n-nodes-qualys
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   4. Leave the NPM_TOKEN secret unset. GitHub's OIDC token is used instead.
#
# Option B — npm Granular Access Token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token,
#      scoped to this package with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret,
#      named NPM_TOKEN.
#
# Both options work with provenance, which is signed by GitHub's OIDC
# infrastructure regardless of how npm authentication is handled.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run `npm run release` locally. It lints, builds, prompts for a version bump,
# updates the changelog, commits, tags and pushes — which triggers this workflow.
# The tag push is the handoff: `npm run release` never runs in CI, because it
# would try to bump and tag a second time. This workflow only publishes the
# commit that the tag already points at.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc. — the tag shape `npm run release` creates.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for the npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        # OIDC trusted publishing (Option A) needs npm >= 11.5.1; the npm bundled
        # with the current Node LTS is older. Harmless under Option B.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish
        # Publishes to npm with a provenance attestation (requires id-token: write
        # above). `prepublishOnly` runs the build, so dist/ is produced here rather
        # than committed. --access public is required for a scoped package.
        #
        # Option A (OIDC): leave NPM_TOKEN unset — npm uses the OIDC exchange.
        # Option B (token): set NPM_TOKEN in repo secrets; setup-node's .npmrc
        #   reads it from NODE_AUTH_TOKEN.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}