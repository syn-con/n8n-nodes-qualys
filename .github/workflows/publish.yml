# Publishes this n8n community node package to npm on every version tag push.
#
# n8n requires community nodes submitted for verification to be published via
# GitHub Actions with an npm provenance statement. Provenance lets anyone
# cryptographically verify that a package was built by this exact workflow, from
# this exact repository and commit. n8n's scanner checks provenance first and
# refuses to scan a package published any other way.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open this package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: syn-con
#        Repository name:  n8n-qualys
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   4. Leave the NPM_TOKEN secret unset. GitHub's OIDC token is used instead.
#
#   The very first publish of a brand-new package name cannot use a trusted
#   publisher, because the package does not exist yet to attach one to. Publish
#   1.0.0 with Option B, then switch, or create the package on npm first.
#
# Option B — npm Granular Access Token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token,
#      scoped to this package with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret,
#      named NPM_TOKEN.
#
# Both options work with provenance, which is signed by GitHub's OIDC
# infrastructure regardless of how npm authentication is handled.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run `npm run release` locally. It lints, builds, prompts for a version bump,
# updates the changelog, commits, tags and pushes — which triggers this workflow.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc. — the tag shape `npm run release` creates.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for the npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # isolated-vm (pulled in by @n8n/node-cli) compiles native code on install
      # and is only used by the n8n runtime the dev server downloads. Publishing
      # needs neither, so the build is skipped here as it is in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      # Distinguishes a first publish from an update, for the notification below.
      - name: Determine release type
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          NAME="$(node -p "require('./package.json').name")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$NAME" version >/dev/null 2>&1; then
            echo "event=package-published" >> "$GITHUB_OUTPUT"
          else
            echo "event=package-created" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of `n8n-node release` in CI.
        #
        # Option A (OIDC): leave NPM_TOKEN unset — the token step is skipped and
        #   npm uses the OIDC exchange instead.
        # Option B (token): set NPM_TOKEN in repo secrets — it is written to
        #   .npmrc here before publishing.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify n8n
        run: |
          curl --fail --show-error --silent \
            -X POST "https://n8n-prod.itsmcloud.lt/webhook/12ed1f70-d87f-4097-bab2-8f8d2cf007f3" \
            -H "Authentication: ${{ secrets.N8N_PROD_AUTH }}" \
            -H "Content-Type: application/json" \
            -d "{\"package\":\"${{ github.repository }}\",\"version\":\"${{ steps.meta.outputs.version }}\",\"releaseType\":\"${{ steps.meta.outputs.event }}\"}"
